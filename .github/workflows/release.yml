name: Release

# Fires on a `vX.Y.Z` tag and produces two things:
#   (a) a GitHub Release carrying the single-file client, wim.mjs, built in this run from the
#       tagged sources, with a SHA256SUMS file and a build provenance attestation on wim.mjs;
#   (b) the self-hosted relay image, ghcr.io/distronode-corporation/worldinmotion-relay,
#       with BuildKit provenance and an SBOM, plus a GitHub attestation on its digest.
# Once the release is public, three gated jobs can publish the same build elsewhere:
#   (c) wim.mjs to npm as the `worldinmotion` package (`npx worldinmotion`), with npm
#       provenance;
#   (d) the .vsix that `test` packaged to the Visual Studio Marketplace, as a pre-release;
#   (e) the same .vsix to Open VSX.
# The Claude Code plugin is not a release asset: the marketplace installs it from the
# repository at the release tag and commit that .claude-plugin/marketplace.json pins, and a
# pull request after each tag moves that pin (CONTRIBUTING.md, "Releasing"). The .vsix is
# not one either; it goes to the two extension registries only.
#
# THE THREE PUBLISH JOBS ARE OFF until a repository variable turns each one on, because
# each registry needs a one-time setup outside this repository first. Each authenticates
# with this workflow's OIDC token through a trusted publisher that names this repository
# and this file, release.yml, with no environment (Open VSX only from its second
# version); renaming the file or adding an environment breaks them until each
# registry's entry is changed to match.
#   npm          vars.NPM_PUBLISH == 'true', after the `worldinmotion` package exists
#                on npm and its trusted publisher names this workflow. npm requires the
#                first publish under a new trusted publisher within 2 days of creating it.
#   marketplace  vars.MARKETPLACE_PUBLISH == 'true', after the Marketplace publisher
#                (the `publisher` in packages/vscode/package.json) has a Trusted
#                Publishing policy naming this workflow, and once .github/publish pins a
#                vsce that has `--oidc` (4.1.0 or later; the job checks).
#   openvsx      vars.OPENVSX_PUBLISH == 'true', after the namespace exists on Open VSX.
#                Its first version must be published with a token (secret OVSX_PAT);
#                once a trusted publisher is registered, deleting the secret switches the
#                job to OIDC. It runs only after `marketplace`, so it cannot go first.
# The CLIs those jobs run (vsce, ovsx) are pinned by .github/publish/package-lock.json and
# installed with --ignore-scripts; npm is the one bundled with the Node in .nvmrc.
#
# Jobs, in order. Each needs the one before it, so nothing leaves the run until everything
# before it has passed:
#   guard    refuses a tag that should not be built (not on main, a version string that
#            disagrees with the tag) and extracts the release notes once.
#   test     ci.yml itself, called as a reusable workflow on the tagged commit, with no
#            npm cache.
#   client   builds wim.mjs and SHA256SUMS. Read-only token; runs dependency code, uploads
#            only to this run's artifact store.
#   draft    attests wim.mjs and creates the release as a DRAFT holding exactly the two
#            assets. It sees the built files, never source.
#   image    builds, pushes and attests the relay image. Holds `packages: write`. It runs
#            only once the draft exists, so a failed asset build never ships an image.
#   publish  makes the draft public, once the image is pushed.
# Then, each gated by a repository variable (see above):
#   npm          needs `publish`; publishes wim.mjs, the bytes `client` built, as
#                `worldinmotion`.
#   marketplace  needs `publish`; publishes the .vsix to the Visual Studio Marketplace.
#   openvsx      needs `marketplace`; publishes the same .vsix to Open VSX.
# A run that fails before `publish` leaves at most a draft release, which a re-run
# rebuilds, and an image job that fails leaves no public release. The registry jobs run
# only after `publish`, so nothing reaches a registry without its GitHub Release; a
# registry job that fails leaves the release public and can be re-run on its own
# (`Re-run failed jobs`). Each refuses a version its registry already holds.
#
# The assets: wim.mjs (run it with Node 22.18 or later) and SHA256SUMS. `draft` checks
# the built set and the uploaded set against exactly those two names. Verifying a download:
#   sha256sum -c SHA256SUMS
#   gh attestation verify wim.mjs --repo distronode-corporation/worldinmotion
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cancel a release in flight: a cancelled run can leave a draft release or a pushed
# image without its attestation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/distronode-corporation/worldinmotion-relay

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.notes.outputs.body }}
      have_notes: ${{ steps.notes.outputs.have_notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed by the ancestry check below: a shallow clone has no merge base.
          fetch-depth: 0
          # The repository is public, so the fetch below needs no credential.
          persist-credentials: false

      # CI runs on pushes to main and on pull requests, not on tags, so a tag on a commit
      # that never reached main would be released without CI having run on it.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Every version string in the repository (each package.json, the lockfile, the plugin
      # and marketplace manifests, the versions typed in source) must equal the tag. The
      # script lists what it checked. The marketplace's plugin pin still names the release
      # before this one (it moves after the tag), which the script expects on a tagged commit.
      - name: The version agrees with the tag
        id: version
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          node .github/scripts/check-versions.mjs "$want"
          echo "version=$want" >> "$GITHUB_OUTPUT"

      # The matching section of CHANGELOG.md becomes the release body, so the two cannot
      # drift. Falls back to GitHub's generated notes when the tag has no entry.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${version}]" '
            index($0, tag)==1 {cap=1; next}
            index($0, "## [")==1 && cap==1 {cap=0}
            substr($0,1,1)=="[" && cap==1 {exit}
            cap {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi
          # Random delimiter, so a CHANGELOG line cannot end the heredoc early.
          delim="body_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat release-notes.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  # The whole CI gate (every platform, the engines floor, workerd, the VS Code smoke test,
  # the plugin tests, the image build, the bundle and version checks), not a copy of it.
  test:
    needs: guard
    permissions:
      contents: read
    # `./` is the documented form for a workflow in the same repository, at the same commit.
    # zizmor proposes `$/`, which actionlint (and this repository's tooling) does not
    # accept yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      no_cache: true
      # The .vsix the marketplace and openvsx jobs publish, as the artifact `vsix`.
      vsix_artifact: true

  client:
    needs: [guard, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches anywhere in this workflow. A tag run can restore caches written by any
      # main-branch run, and a restored node_modules is build input nobody reviewed in
      # this run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci

      # Writes packages/client/dist/wim.mjs and its copy, plugins/claude-code/dist/client.mjs.
      - name: Build wim.mjs from the tagged sources
        run: npm run bundle -w @worldinmotion/client

      # The plugin users install from the repository at this tag carries the committed copy;
      # it must be the same bytes as the file this release attaches.
      - name: The committed plugin bundle equals this build
        run: git diff --exit-code --stat plugins/claude-code/dist/client.mjs

      - name: Stage wim.mjs and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p staging
          cp packages/client/dist/wim.mjs staging/wim.mjs
          (cd staging && sha256sum wim.mjs > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat staging/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client
          path: staging/
          if-no-files-found: error

  draft:
    needs: [guard, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # The attestation on wim.mjs.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job never checks out the repository, so `gh` is told which one to use.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: assets

      - name: The release assets are exactly what was expected
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' SHA256SUMS wim.mjs | sort)"
          actual="$(cd assets && find . -type f -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::built assets do not match what a release must carry"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          (cd assets && sha256sum -c SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/wim.mjs

      # Draft first, so nothing is visible until the image is pushed too.
      - name: Create the draft release
        env:
          NOTES: ${{ needs.guard.outputs.body }}
          HAVE_NOTES: ${{ needs.guard.outputs.have_notes }}
        run: |
          set -euo pipefail
          # A leftover draft from a failed run is rebuilt; a public release is never touched.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$TAG" --yes
            else
              echo "::error::$TAG is already published. Refusing to modify a public release."
              exit 1
            fi
          fi
          # Pre-1.0 releases are marked as prereleases.
          if [ "$HAVE_NOTES" = "true" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
            gh release create "$TAG" --draft --prerelease --title "worldinmotion $TAG" \
              --notes-file release-notes.md assets/*
          else
            gh release create "$TAG" --draft --prerelease --title "worldinmotion $TAG" \
              --generate-notes assets/*
          fi

      - name: GitHub holds the assets
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' SHA256SUMS wim.mjs | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the draft release does not hold the expected assets; leaving it as a draft"
            exit 1
          fi

  image:
    needs: [guard, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Push to ghcr.io.
      packages: write
      # The attestation on the image digest: OIDC for Sigstore, and storing the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Semver tags only (0.1.2 and 0.1), never `latest` from a pre-1.0 line.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version is pushed once. Re-running a release whose image is already out would
      # otherwise move the version tag to a different digest.
      - name: The version is not in the registry yet
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists. Refusing to overwrite it."
            exit 1
          fi

      # packages/relay-node/Dockerfile builds from the repository root as context (ci.yml
      # builds it on every change). linux/amd64 only for now; arm64 would add
      # docker/setup-qemu-action.
      # The registry credential stays in the runner's docker config and is not part of
      # the build context, so the Dockerfile's own `npm ci` cannot read it.
      # No `cache-from`/`cache-to`, for the same reason this workflow has no npm cache.
      - name: Build and push the relay image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/relay-node/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Verifiable with:
      #   gh attestation verify oci://ghcr.io/distronode-corporation/worldinmotion-relay:<version> \
      #     --repo distronode-corporation/worldinmotion
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [draft, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Turning the draft into a public release.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish
        run: gh release edit "$TAG" --draft=false

  # npm: `npx worldinmotion` and `npm install --global worldinmotion` (which installs `wim`).
  # The package is packaging/npm: wim.mjs and nothing else to run, no dependencies, because
  # the workspace packages export TypeScript sources, which Node refuses to strip inside
  # node_modules. The file is the one `client` built and `draft` attested, checked against
  # SHA256SUMS again here. Trusted publishing: npm exchanges this job's OIDC token for a
  # one-time publish token (npm 11.5.1 or later) and adds the provenance attestation itself.
  npm:
    needs: [guard, client, publish]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The checkout.
      contents: read
      # The OIDC token npm exchanges for the publish, and signs the provenance with.
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # registry-url as npm's trusted publishing guide has it. No cache, as everywhere here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: assets

      - name: Stage the package
        run: |
          set -euo pipefail
          (cd assets && sha256sum -c SHA256SUMS)
          cp assets/wim.mjs packaging/npm/wim.mjs
          cp LICENSE NOTICE packaging/npm/
          have="$(node -p 'require("./packaging/npm/package.json").version')"
          if [ "$have" != "$VERSION" ]; then
            echo "::error::packaging/npm/package.json is $have, the tag is $VERSION."
            exit 1
          fi

      # Older npm has no trusted publishing and would fail with an authentication error.
      - name: npm supports trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          echo "npm $have"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have predates trusted publishing (11.5.1)."
            exit 1
          fi

      # Asked of the registry without credentials: 404 means not published, 200 means it is,
      # anything else is an answer this job cannot read.
      - name: The version is not on npm yet
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/worldinmotion/$VERSION")"
          case "$status" in
            404) echo "worldinmotion@$VERSION is not on npm yet" ;;
            200) echo "::error::worldinmotion@$VERSION is already on npm. Refusing to publish it again."; exit 1 ;;
            *) echo "::error::the npm registry answered $status for worldinmotion@$VERSION"; exit 1 ;;
          esac

      - name: Publish to npm
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm publish --provenance --access public

  # The Visual Studio Marketplace, as a pre-release (`preview` in the manifest, and the
  # .vsix packaged with --pre-release). The .vsix is the one `test` packaged and
  # smoke-tested on this commit. `vsce publish --oidc` exchanges this job's OIDC token
  # (audience marketplace.visualstudio.com) for a Marketplace credential through the
  # publisher's Trusted Publishing policy, and never falls back to a PAT.
  marketplace:
    needs: [guard, publish]
    if: vars.MARKETPLACE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The checkout.
      contents: read
      # The OIDC token vsce exchanges.
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Only the publishing CLIs, from their own lockfile, and no install scripts.
      - name: Install vsce
        working-directory: .github/publish
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: vsce has --oidc
        working-directory: .github/publish
        run: |
          set -euo pipefail
          npx --no -- vsce --version
          if ! npx --no -- vsce publish --help | grep -q -- '--oidc'; then
            echo "::error::the vsce in .github/publish/package-lock.json has no --oidc; pin @vscode/vsce 4.1.0 or later there."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix

      - name: The .vsix is this version's
        run: |
          set -euo pipefail
          expected="worldinmotion-$VERSION.vsix"
          actual="$(cd vsix && find . -type f -printf '%f\n')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected exactly $expected in the vsix artifact, found: $actual"
            exit 1
          fi
          sha256sum "vsix/$expected"

      # --pre-release makes vsce check that the .vsix was packaged as one.
      - name: Publish to the Marketplace
        working-directory: .github/publish
        run: npx --no -- vsce publish --oidc --pre-release --packagePath "$GITHUB_WORKSPACE/vsix/worldinmotion-$VERSION.vsix"

  # Open VSX, the registry Cursor, VSCodium and other VS Code builds install from. Same
  # .vsix. The first version of an extension must be published with a token, so while the
  # secret OVSX_PAT exists this job uses it; once a trusted publisher is registered for the
  # namespace, deleting the secret switches it to OIDC (`--trusted-publishing`, which fails
  # rather than falling back when there is no ID token). ovsx reads the pre-release flag
  # from the .vsix itself.
  openvsx:
    needs: [guard, marketplace]
    if: vars.OPENVSX_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The checkout.
      contents: read
      # The OIDC token for trusted publishing, once OVSX_PAT is gone.
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install ovsx
        working-directory: .github/publish
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix

      - name: The .vsix is this version's
        run: |
          set -euo pipefail
          expected="worldinmotion-$VERSION.vsix"
          actual="$(cd vsix && find . -type f -printf '%f\n')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected exactly $expected in the vsix artifact, found: $actual"
            exit 1
          fi
          sha256sum "vsix/$expected"

      - name: Publish to Open VSX
        working-directory: .github/publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          vsix="$GITHUB_WORKSPACE/vsix/worldinmotion-$VERSION.vsix"
          npx --no -- ovsx --version
          if [ -n "$OVSX_PAT" ]; then
            echo "Publishing with the OVSX_PAT token."
            npx --no -- ovsx publish "$vsix"
          else
            echo "No OVSX_PAT: publishing through Open VSX trusted publishing."
            env -u OVSX_PAT npx --no -- ovsx publish "$vsix" --trusted-publishing
          fi
