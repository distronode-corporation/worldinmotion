name: Scorecard

# OpenSSF Scorecard: a third-party read of this repository's supply-chain posture (pinned
# actions, token permissions, branch protection, signed releases, and so on). Results go
# to code scanning as SARIF and are published to the public Scorecard API.
#
# Not on pull requests: scorecard-action documents that trigger as experimental, and
# publishing needs `id-token: write`, which means nothing on a pull request.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday, so a check that decays with time still reports
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result, so the public API can tell it came from this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
