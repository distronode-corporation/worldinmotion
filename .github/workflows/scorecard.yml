name: Scorecard

# OpenSSF Scorecard: a third-party read of this repository's supply-chain posture (pinned
# actions, token permissions, branch protection, signed releases, and so on). Results go
# to code scanning as SARIF and are published to the public Scorecard API.
#
# Not on pull requests: scorecard-action documents that trigger as experimental, and
# publishing needs `id-token: write`, which means nothing on a pull request.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday, so a check that decays with time still reports
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result, so the public API can tell it came from this repo.
      id-token: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
