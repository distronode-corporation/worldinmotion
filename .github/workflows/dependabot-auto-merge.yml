name: Dependabot auto-merge

# Turns on GitHub's own auto-merge for the routine part of Dependabot's weekly pull
# requests: a patch or minor update that touches development dependencies only. The
# merge is queued, not performed: GitHub completes it only once the branch ruleset's
# required checks (ci.yml) have passed. Everything else (runtime dependencies, majors,
# indirect-only lockfile updates, action bumps) waits for a person, because runtime code
# here sits next to private keys.
#
# dependabot.yml holds every version update back behind a 7-day cooldown, so nothing
# here can merge a release that was yanked days after publication.
#
# The trigger is `pull_request` and must never become `pull_request_target`: that event
# runs with a write token and repository secrets in the base branch context while the
# head is untrusted. The job-level `permissions:` block below is the supported way to get
# the token scope this needs.
#
# Two settings live outside this file: `dependabot/fetch-metadata` must be on the
# organisation's Actions allow-list, and the repository's "Allow auto-merge" setting must
# be on, or `gh pr merge --auto` exits non-zero.
on:
  pull_request:

# Nothing at the top level, so a job added later starts with no token scope at all.
permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge for patch and minor development updates
    # `pull_request.user.login` is the account that opened the pull request and cannot
    # change afterwards. `github.actor` is the last actor to touch it, which is spoofable
    # (zizmor's `bot-conditions` audit). The repository check keeps this from running in
    # a fork.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'distronode-corporation/worldinmotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dependabot-triggered runs get a read-only token unless scopes are named here.
    permissions:
      # The queued merge is a write to the base branch.
      contents: write
      # Enabling auto-merge on the pull request.
      pull-requests: write
    steps:
      # No checkout, on purpose: the pull request's contents never run in a job that
      # holds a write-scoped token. Everything is read through the API.
      #
      # `update-type` is the HIGHEST semver change across the group and `dependency-type`
      # the most privileged type (production over development over indirect), both
      # computed by the action over every updated dependency. So one major, or one
      # runtime dependency, inside a group makes the whole pull request ineligible.
      - name: Read Dependabot's metadata for this pull request
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # PR_URL goes through `env:` rather than being expanded inside `run:` (zizmor's
      # `template-injection` remediation).
      - name: Enable auto-merge (squash)
        if: >-
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
