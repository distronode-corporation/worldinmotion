version: 2

# Three ecosystems, because this repository has three kinds of pin that age independently:
# the npm lockfiles, the action SHAs, and the relay image's base-image digest. Every `uses:` in .github/workflows is pinned
# to a full commit SHA with a `# vX.Y.Z` comment, which is right for supply-chain safety
# and wrong for noticing a security fix: a pinned SHA never moves on its own. The
# `github-actions` entry turns each pin into a pull request, rewriting both the SHA and
# the version comment.
#
# `cooldown` holds a version update back until the release is a week old, so a
# compromised publish that is yanked within days never reaches a pull request here. It
# matches the 7-day rule in CONTRIBUTING.md. It does not delay SECURITY updates, which
# Dependabot opens as soon as an advisory lands, so dependabot-auto-merge.yml never merges
# one: those wait for a person.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One pull request for the routine bumps. A major usually needs a workflow edit, so
      # it is left on its own.
      actions-minor:
        update-types: [minor, patch]

  # The root directory covers every workspace: npm workspaces share the one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Exact pins stay exact: Dependabot rewrites "1.2.3" to "1.2.4", never to a range.
    versioning-strategy: increase
    ignore:
      # @types/node follows the oldest Node the packages support (engines: >=22.18), so code
      # cannot type-check against an API that Node 22 lacks. A new major comes with a
      # deliberate engines change, not from a bot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Split by dependency type so that a group's type is unambiguous.
      # dependabot-auto-merge.yml merges only the npm-dev-minor group's patch and minor
      # updates; everything else, runtime dependencies (the crypto libraries above all)
      # included, waits for a person.
      #
      # None of these groups sets `applies-to`, so each covers version updates only. A
      # security update is never grouped here: it arrives as its own pull request with no
      # group, outside the cooldown, and dependabot-auto-merge.yml leaves it to a person.
      #
      # The build tools that write what users run, in their own group so that a person
      # reads every update: esbuild writes the client bundle (packages/client/dist/wim.mjs,
      # its copy plugins/claude-code/dist/client.mjs, and the npm package) and the
      # extension's dist/extension.js; @vscode/vsce packages the .vsix that release.yml
      # publishes; wrangler bundles the Worker relay when it is deployed. A dependency goes
      # into the first group it matches, so this group comes first, and npm-dev-minor also
      # excludes the same names in case the order is ever changed.
      npm-build-tools:
        patterns: [esbuild, "@vscode/vsce", wrangler]
        update-types: [minor, patch]
      npm-dev-minor:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [esbuild, "@vscode/vsce", wrangler]
      npm-prod-minor:
        dependency-type: production
        update-types: [minor, patch]

  # The Claude Code CLI that ci.yml runs the plugin's tests with. Its own lockfile, outside
  # the workspaces, so the CLI is not installed by every `npm ci`. A runtime dependency in
  # that package.json, so dependabot-auto-merge.yml leaves its updates to a person.
  - package-ecosystem: npm
    directory: /.github/claude-code
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase

  # vsce and ovsx, which release.yml's marketplace and openvsx jobs publish with. Their own
  # lockfile, so a publishing job installs only them, never the workspaces. Runtime
  # dependencies in that package.json, so dependabot-auto-merge.yml leaves every update
  # to a person: these run with an OIDC token that can publish the extension.
  - package-ecosystem: npm
    directory: /.github/publish
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase

  # The relay image's base, pinned by digest on both FROM lines of the Dockerfile. A digest
  # update is how a Debian or Node security fix reaches the next relay image. Never merged
  # automatically: dependabot-auto-merge.yml handles npm development updates only.
  - package-ecosystem: docker
    directory: /packages/relay-node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The relay image stays on the Node line in .nvmrc (24, the current LTS). A new major
      # is a deliberate change made with .nvmrc and CI, and odd-numbered majors are never LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
