# /etc/tmpfiles.d/wim-agent.conf
# /run is empty after a boot. The privileged runner keeps its job lock here.
# Root alone: the runner makes it root:root 0750 itself before each lock, and
# this entry makes it exist from boot. No agent user needs it any more (the
# job holds no credential and no token file is written).
d /run/wim-agent 0750 root root -
