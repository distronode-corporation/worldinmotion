# The pipeline of the component's own project, where the GitLab CI/CD Catalog lists `notify`.
# worldinmotion's release workflow writes this project and pushes one semver tag (X.Y.Z) per
# release; the Catalog takes a version only from a job with the `release:` keyword on such a tag,
# which is the one job here. Change this file in worldinmotion
# (packaging/gitlab-component/.gitlab-ci.yml), never here.
stages: [release]

release:
  stage: release
  # glab, which the `release:` keyword runs. Pinned by digest.
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
  rules:
    - if: $CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
  script:
    - echo "Releasing $CI_PROJECT_PATH $CI_COMMIT_TAG to the CI/CD Catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: >-
      The worldinmotion CI notice component from worldinmotion $CI_COMMIT_TAG. Release notes:
      https://github.com/distronode-corporation/worldinmotion/releases/tag/v$CI_COMMIT_TAG
